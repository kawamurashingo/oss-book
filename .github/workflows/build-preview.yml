name: Build book previews

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Pandoc and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk poppler-utils libpango-1.0-0 libpangocairo-1.0-0
      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt -r requirements-sample.txt
      - name: Audit publication metadata (preview mode)
        run: |
          python scripts/check_release_readiness.py
          python -m unittest discover -s tests -v
      - name: Build PDF and EPUB previews
        run: python scripts/build_release.py
      - name: Verify planned issue date is labeled as planned
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('publication/imprint.json').read_text(encoding='utf-8'))
          text = Path('output/body.md').read_text(encoding='utf-8')
          if data['publication_status'] == 'planned':
              assert '奥付（発行予定・校正用）' in text
              assert '発行予定日：' in text
              assert '発行日：' not in text
              print('Planned issue date correctly labeled in book preview')
          PY
      - name: Verify generated files
        run: |
          test -s output/oss-book.pdf
          test -s output/oss-book.epub
          test -s output/cover.png
          pdfinfo output/oss-book.pdf | grep -E 'Pages:|Page size:'
          unzip -t output/oss-book.epub | tail -1
          unzip -p output/oss-book.epub EPUB/content.opf | grep -E 'properties="cover-image"'
      - name: Install official EPUBCheck 5.4.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
            --output "$RUNNER_TEMP/epubcheck.zip"
          mkdir -p "$RUNNER_TEMP/epubcheck"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          JAR=$(find "$RUNNER_TEMP/epubcheck" -name epubcheck.jar -type f -print -quit)
          test -n "$JAR"
          echo "EPUBCHECK_JAR=$JAR" >> "$GITHUB_ENV"
      - name: Validate EPUB 3 with official EPUBCheck
        run: java -jar "$EPUBCHECK_JAR" output/oss-book.epub
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oss-book-preview-${{ github.run_number }}
          path: |
            output/oss-book.pdf
            output/oss-book.epub
            output/cover.png
            output/manuscript.md
          if-no-files-found: error
